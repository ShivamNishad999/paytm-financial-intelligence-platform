name: growsaathi
description: "GrowSAATHI — AI-Powered Merchant Growth Partner"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Networking
  dio: ^5.4.0

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^13.2.0

  # Charts
  fl_chart: ^0.68.0

  # Local storage / settings
  shared_preferences: ^2.2.2

  # Formatting
  intl: ^0.19.0

  # Images (kept for future customer/product avatars)
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/mock/dashboard_mock.json
